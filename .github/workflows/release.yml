name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes de unidade
        run: ./gradlew :app:testDebugUnitTest

      - name: Gerar APK
        run: |
          ./gradlew :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk CtrlMesh-celular.apk
          cp app/build/outputs/apk/debug/app-debug.apk CtrlMesh-multimidia.apk

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" CtrlMesh-celular.apk CtrlMesh-multimidia.apk \
            --title "CtrlMesh $GITHUB_REF_NAME" --notes-file .github/release-notes.md
